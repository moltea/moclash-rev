name: Bug report
title: '[BUG] '
description: Report the issue you are experiencing
labels: ['bug']
type: 'Bug'

body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting the issue, please make sure of the following checklist:

        1. Please make sure there is no similar issue in the [existing issues](https://github.com/moltea/moclash-rev/issues?q=is%3Aissue), otherwise please discuss under the existing issue
        2. Please be sure to fill in a concise and clear title for the issue so that others can quickly search
        3. Please be sure to check the [Nightly](https://github.com/moltea/moclash-rev/releases/tag/autobuild) release notes
        4. Please be sure to try the [Nightly](https://github.com/moltea/moclash-rev/releases/tag/autobuild) build to confirm the problem still exists
        5. Please describe the problem in detail according to the template, otherwise the issue may be closed

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Describe the problem you encountered in detail and clearly, and provide screenshots
    validations:
      required: true
  - type: textarea
    attributes:
      label: Moclash Version
      description: Please provide the specific version of Moclash. If it is a Nightly build, please indicate the download time (accurate to hours and minutes)
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: OS
      options:
        - label: Windows
        - label: Linux
        - label: MacOS
    validations:
      required: true
  - type: input
    attributes:
      label: OS Version
      description: Please provide your OS version, for Linux, please also provide the desktop environment and window system
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log (Do not upload the log file, paste the log content directly)
      description: Please provide a complete or relevant part of the debug log. Set "Settings" -> "Log Level" to debug; for application errors, also set "Miscellaneous" -> "App Log Level" to debug and restart the app. The log files are in "Settings" -> "Log Directory". Remove subscription URLs, passwords and other credentials before pasting.
      placeholder: |
        The log directory is usually the "logs/" subdirectory of the application data directory. Please paste the log content here.
      render: log
    validations:
      required: true
