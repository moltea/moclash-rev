name: I18N
title: '[I18N] '
description: For issues or suggestions related to translations and internationalization
labels: ['I18n']
type: 'Task'

body:
  - type: markdown
    attributes:
      value: |
        ## I18N issues and suggestions
        Please use this template for translation errors, missing translations, suggestions, or new language requests.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe your I18N issue or suggestion in detail
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: e.g. zh, en, jp, ru, ...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion or Correction
      description: If this is a translation correction or suggestion, please provide the suggested content
    validations:
      required: false

  - type: checkboxes
    id: i18n-type
    attributes:
      label: Issue Type
      description: Please select the applicable type(s)
      options:
        - label: Translation error
        - label: Missing translation
        - label: Suggestion
        - label: New language
    validations:
      required: true

  - type: input
    id: verge-version
    attributes:
      label: Moclash Version
      description: Please provide the specific version of Moclash you are using
    validations:
      required: true
