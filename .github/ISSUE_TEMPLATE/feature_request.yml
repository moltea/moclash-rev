name: Feature request
title: '[Feature] '
description: Propose your feature request
labels: ['enhancement']
type: 'Feature'

body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting the issue, please make sure of the following checklist:
        1. Please make sure there is no similar issue in the [existing issues](https://github.com/moltea/moclash-rev/issues?q=is%3Aissue), otherwise please discuss under the existing issue
        2. Please be sure to fill in a concise and clear title for the issue so that others can quickly search
        3. Please be sure to test the [Nightly](https://github.com/moltea/moclash-rev/releases/tag/autobuild) build to make sure the feature has not been implemented yet
        4. Please describe the request in detail according to the template, otherwise the issue may be closed

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: A clear and concise description of what the feature is
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use case
      description: Please describe the use case of your feature request
    validations:
      required: true
  - type: checkboxes
    id: os-labels
    attributes:
      label: Target OS
      description: Please select the operating system(s) for this feature request (select at least one)
      options:
        - label: windows
        - label: macos
        - label: linux
    validations:
      required: true
