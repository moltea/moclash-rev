name: Updater CI

on: workflow_dispatch
permissions: write-all
env:
  HUSKY: 0

jobs:
  check_updater_key:
    name: Check Updater Signing Key
    runs-on: ubuntu-latest
    outputs:
      has_updater_key: ${{ steps.check_updater_key.outputs.has_updater_key }}
    steps:
      - name: Check updater signing key
        id: check_updater_key
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_PRIVATE_KEY != '' }}
        run: |
          echo "has_updater_key=$HAS_UPDATER_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::TAURI_PRIVATE_KEY is not set, updater files will not be published"
          fi

  release-update:
    if: ${{ needs.check_updater_key.outputs.has_updater_key == 'true' }}
    runs-on: ubuntu-latest
    needs: [check_updater_key]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i

      - name: Release updater file
        run: pnpm updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-update-for-fixed-webview2:
    if: ${{ needs.check_updater_key.outputs.has_updater_key == 'true' }}
    runs-on: ubuntu-latest
    needs: [check_updater_key]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i

      - name: Release updater file
        run: pnpm updater-fixed-webview2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
